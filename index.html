<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Roomie Ranker — Hostel Check-In</title>
<meta name="description" content="Check in to your hostel, rate your roomies and survive the chaos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#080a0f; --card:rgba(255,255,255,.045); --bd:rgba(255,255,255,.1);
  --tx:#eceef4; --mut:#8d95aa; --in:#6366f1; --in2:#818cf8; --am:#f59e0b; --rd:#f87171;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  font-family:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  background:var(--bg); color:var(--tx); min-height:100vh; min-height:100dvh;
  display:flex; align-items:center; justify-content:center; padding:24px 16px;
  background-image:
    radial-gradient(60rem 30rem at 15% -10%, rgba(99,102,241,.22), transparent 60%),
    radial-gradient(50rem 28rem at 105% 110%, rgba(245,158,11,.16), transparent 60%);
  background-attachment:fixed;
}
.shell{width:100%;max-width:460px}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin-bottom:18px}
.brand .logo{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:22px;
  background:linear-gradient(135deg,var(--in),var(--am));box-shadow:0 8px 24px rgba(99,102,241,.35)}
.brand b{font-size:22px;letter-spacing:-.02em}
.brand b span{color:var(--am)}
.card{
  background:var(--card); border:1px solid var(--bd); border-radius:22px; padding:26px 22px;
  backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
  box-shadow:0 20px 60px rgba(0,0,0,.45);
}
h1{font-size:24px;letter-spacing:-.02em;text-align:center}
.sub{color:var(--mut);font-size:14px;text-align:center;margin:6px 0 18px}
.preview{display:flex;flex-direction:column;align-items:center;gap:8px;margin-bottom:18px}
.preview img{width:92px;height:92px;border-radius:50%;border:3px solid rgba(99,102,241,.6);
  background:#1b1f2e;box-shadow:0 0 0 6px rgba(99,102,241,.12),0 10px 30px rgba(0,0,0,.4);transition:transform .25s}
.preview img.bump{transform:scale(1.08)}
.preview small{color:var(--mut);font-size:12px;min-height:16px}
.field{margin-bottom:14px}
label{display:block;font-size:12px;font-weight:700;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px}
input,select{
  width:100%;background:rgba(0,0,0,.35);color:var(--tx);border:1px solid var(--bd);
  border-radius:12px;padding:13px 14px;font:inherit;font-size:15px;outline:none;transition:border-color .2s, box-shadow .2s;
}
select option{background:#12151f;color:var(--tx)}
input:focus,select:focus{border-color:var(--in2);box-shadow:0 0 0 3px rgba(99,102,241,.25)}
input.bad{border-color:var(--rd);box-shadow:0 0 0 3px rgba(248,113,113,.18)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.err{color:var(--rd);font-size:12px;min-height:16px;margin-top:5px}
.form-err{color:var(--rd);font-size:13px;text-align:center;min-height:18px;margin:2px 0 8px}
.btn{
  width:100%;border:0;border-radius:14px;padding:14px;font:inherit;font-weight:800;font-size:16px;cursor:pointer;color:#fff;
  background:linear-gradient(135deg,var(--in),#8b5cf6);box-shadow:0 10px 26px rgba(99,102,241,.4);
  transition:transform .15s, box-shadow .2s;
}
.btn:hover{transform:translateY(-1px) scale(1.01)}
.btn:active{transform:scale(.97)}
.btn:focus-visible,.pill:focus-visible{outline:2px solid var(--am);outline-offset:2px}
.recent{margin-top:20px;padding-top:18px;border-top:1px dashed var(--bd)}
.recent[hidden]{display:none}
.recent h2{font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pill{
  display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.05);border:1px solid var(--bd);color:var(--tx);
  border-radius:999px;padding:5px 12px 5px 5px;cursor:pointer;font:inherit;font-size:13px;font-weight:600;
  transition:transform .15s,border-color .2s,background .2s;
}
.pill:hover{transform:translateY(-2px);border-color:var(--am);background:rgba(245,158,11,.1)}
.pill img{width:28px;height:28px;border-radius:50%;background:#1b1f2e}
.pill em{font-style:normal;color:var(--mut);font-weight:500;font-size:12px}
.foot{text-align:center;color:var(--mut);font-size:12px;margin-top:14px}
@media (max-width:420px){.row{grid-template-columns:1fr}.card{padding:22px 16px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="shell">
  <div class="brand"><div class="logo" aria-hidden="true">🏠</div><b>Roomie <span>Ranker</span></b></div>
  <main class="card">
    <h1>Hostel Check-In</h1>
    <p class="sub">Tell us who you are. Your roommates already have opinions.</p>

    <div class="preview">
      <img id="avatar" alt="Your avatar preview" width="92" height="92" data-name="Roomie">
      <small id="avatarNote">Type your name to meet your avatar</small>
    </div>

    <form id="checkin" novalidate autocomplete="off">
      <div class="field">
        <label for="name">Student Name</label>
        <input id="name" type="text" maxlength="30" placeholder="e.g. Arjun Kumar" required>
        <div class="err" id="nameErr"></div>
      </div>
      <div class="field">
        <label for="block">Hostel Block</label>
        <select id="block">
          <option>Block A (Freshers)</option>
          <option>Block B (4AM Coders)</option>
          <option>Block C (Maggi Zone)</option>
          <option>Block D (Senior Wing)</option>
        </select>
      </div>
      <div class="row">
        <div class="field">
          <label for="room">Room No.</label>
          <input id="room" type="text" maxlength="10" placeholder="304-B" required>
          <div class="err" id="roomErr"></div>
        </div>
        <div class="field">
          <label for="pin">4-Digit Mess PIN</label>
          <input id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••" required>
          <div class="err" id="pinErr"></div>
        </div>
      </div>
      <div class="form-err" id="formErr" role="alert"></div>
      <button class="btn" type="submit">Check In 🚀</button>
    </form>

    <section class="recent" id="recent" hidden>
      <h2>Previously checked-in · tap to switch</h2>
      <div class="pills" id="pills"></div>
    </section>
  </main>
  <p class="foot">Data lives only in this browser (localStorage). No servers, no snitching.</p>
</div>

<script>
(function(){
  'use strict';
  var K = { user:'rr_current_user', residents:'rr_residents' };

  function read(key, fb){
    try{ var v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; }catch(e){ return fb; }
  }
  function write(key, val){
    try{ localStorage.setItem(key, JSON.stringify(val)); return true; }catch(e){ return false; }
  }
  function escapeHTML(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function avatarUrl(name){
    var seed = encodeURIComponent((name || '').trim() || 'Roomie');
    return 'https://api.dicebear.com/10.x/notionists/svg?seed=' + seed + '&backgroundColor=b6e3f4,c0aede,d1d4f9,ffd5dc,ffdfbf';
  }
  function fallbackSvg(name){
    var ch = ((name || '?').trim().charAt(0) || '?').toUpperCase();
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#312e81"/>' +
      '<text x="50" y="50" dy=".35em" text-anchor="middle" font-family="sans-serif" font-size="48" font-weight="700" fill="#fbbf24">' +
      escapeHTML(ch) + '</text></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  }
  window.avFallback = function(img){
    img.onerror = null;
    img.src = fallbackSvg(img.getAttribute('data-name') || '?');
  };

  var $ = function(id){ return document.getElementById(id); };
  var avatar = $('avatar'), nameIn = $('name'), roomIn = $('room'), pinIn = $('pin');

  avatar.onerror = function(){ window.avFallback(avatar); };
  function setAvatar(name){
    avatar.setAttribute('data-name', name || 'Roomie');
    avatar.onerror = function(){ window.avFallback(avatar); };
    avatar.src = avatarUrl(name);
    avatar.classList.add('bump');
    setTimeout(function(){ avatar.classList.remove('bump'); }, 180);
    $('avatarNote').textContent = name.trim() ? 'Looking good, ' + name.trim().split(' ')[0] + '.' : 'Type your name to meet your avatar';
  }
  setAvatar('');

  var t;
  nameIn.addEventListener('input', function(){
    clearTimeout(t);
    t = setTimeout(function(){ setAvatar(nameIn.value); }, 220);
    nameIn.classList.remove('bad'); $('nameErr').textContent = '';
  });
  roomIn.addEventListener('input', function(){ roomIn.classList.remove('bad'); $('roomErr').textContent = ''; });
  pinIn.addEventListener('input', function(){
    pinIn.value = pinIn.value.replace(/\D/g, '').slice(0, 4);
    pinIn.classList.remove('bad'); $('pinErr').textContent = '';
  });

  function fail(input, errId, msg){ input.classList.add('bad'); $(errId).textContent = msg; }

  function loginAs(user){
    if(!write(K.user, user)){
      $('formErr').textContent = 'Your browser blocked storage (private mode?). Please allow site data and retry.';
      return;
    }
    window.location.href = 'dashboard.html';
  }

  $('checkin').addEventListener('submit', function(e){
    e.preventDefault();
    $('formErr').textContent = '';
    var name = nameIn.value.trim().replace(/\s+/g, ' ');
    var room = roomIn.value.trim();
    var pin = pinIn.value;
    var ok = true;
    if(name.length < 2){ fail(nameIn, 'nameErr', 'Name needs at least 2 characters.'); ok = false; }
    if(!room){ fail(roomIn, 'roomErr', 'Room number is required.'); ok = false; }
    if(!/^\d{4}$/.test(pin)){ fail(pinIn, 'pinErr', 'Enter your 4-digit PIN.'); ok = false; }
    if(!ok) return;

    var residents = read(K.residents, []);
    if(!Array.isArray(residents)) residents = [];
    var key = name.toLowerCase();
    var existing = null;
    for(var i = 0; i < residents.length; i++){
      if(String(residents[i].name).trim().toLowerCase() === key){ existing = residents[i]; break; }
    }
    var user;
    if(existing){
      existing.block = $('block').value;
      existing.room = room;
      user = { name: existing.name, block: existing.block, room: existing.room, joinedAt: existing.joinedAt };
    }else{
      user = { name: name, block: $('block').value, room: room, joinedAt: Date.now() };
      residents.push({ name: user.name, block: user.block, room: user.room, joinedAt: user.joinedAt });
    }
    if(!write(K.residents, residents)){
      $('formErr').textContent = 'Could not save your check-in. Please allow site data and retry.';
      return;
    }
    loginAs(user);
  });

  function renderPills(){
    var residents = read(K.residents, []);
    var box = $('recent');
    if(!Array.isArray(residents) || !residents.length){ box.hidden = true; return; }
    box.hidden = false;
    $('pills').innerHTML = residents.map(function(r, i){
      return '<button type="button" class="pill" data-i="' + i + '" title="Switch to ' + escapeHTML(r.name) + '">' +
        '<img src="' + escapeHTML(avatarUrl(r.name)) + '" data-name="' + escapeHTML(r.name) + '" alt="" width="28" height="28" onerror="avFallback(this)">' +
        '<span>' + escapeHTML(r.name) + ' <em>' + escapeHTML(r.room) + '</em></span></button>';
    }).join('');
  }
  $('pills').addEventListener('click', function(e){
    var b = e.target.closest('.pill'); if(!b) return;
    var residents = read(K.residents, []);
    var r = residents[+b.getAttribute('data-i')];
    if(r) loginAs({ name: r.name, block: r.block, room: r.room, joinedAt: r.joinedAt });
  });
  renderPills();
})();
</script>
<!-- ===== LIGHT / DARK MODE: paste this whole block right before </body> ===== -->
<style>
/* ---------- light palette (dark stays your existing default) ---------- */
html[data-theme="dark"]{color-scheme:dark}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f3f4fa; --card:rgba(255,255,255,.88); --card2:#ffffff; --bd:rgba(22,26,43,.14);
  --tx:#161a2b; --mut:#5b6380; --in:#5457e6; --in2:#4338ca;
  --am:#b45309; --rd:#dc2626; --gr:#047857; --bl:#2563eb;
}
html[data-theme="light"] body{
  background-image:
    radial-gradient(60rem 30rem at 10% -10%, rgba(99,102,241,.14), transparent 60%),
    radial-gradient(50rem 28rem at 100% 40%, rgba(245,158,11,.12), transparent 60%)}

/* surfaces */
html[data-theme="light"] .nav{background:rgba(255,255,255,.86)}
html[data-theme="light"] .bottom{background:rgba(255,255,255,.95)}
html[data-theme="light"] .chat{background:rgba(255,255,255,.97)}
html[data-theme="light"] .modal,
html[data-theme="light"] .toast{background:#fff}
html[data-theme="light"] .ov{background:rgba(22,26,43,.45)}
html[data-theme="light"] .card{box-shadow:0 1px 2px rgba(22,26,43,.06),0 10px 30px rgba(22,26,43,.08)}
html[data-theme="light"] .toast,
html[data-theme="light"] .modal{box-shadow:0 20px 60px rgba(22,26,43,.25)}

/* form fields */
html[data-theme="light"] input:not([type="checkbox"]),
html[data-theme="light"] select,
html[data-theme="light"] textarea{background:#fff}
html[data-theme="light"] select option{background:#fff;color:#161a2b}

/* translucent panels that were tinted white-on-dark */
html[data-theme="light"] .reply,
html[data-theme="light"] .lead,
html[data-theme="light"] .stats div,
html[data-theme="light"] .rk,
html[data-theme="light"] .quote,
html[data-theme="light"] .perks li,
html[data-theme="light"] .m.bot,
html[data-theme="light"] .typing,
html[data-theme="light"] .act,
html[data-theme="light"] .pill{background:rgba(22,26,43,.05)}
html[data-theme="light"] .bar .tr,
html[data-theme="light"] .hist .tube{background:rgba(22,26,43,.1)}
html[data-theme="light"] .reply.best{background:rgba(16,185,129,.1)}
html[data-theme="light"] .ghosts i{background:#9aa3bd}
html[data-theme="light"] .ghosts s{background:#b6bdd3}
html[data-theme="light"] .preview img{background:#e5e7f5}

/* stars */
html[data-theme="light"] .star{color:#c9cee0}
html[data-theme="light"] .star.on{color:#f59e0b}

/* pale text colours that need to go darker on a light background */
html[data-theme="light"] .tag-pill,
html[data-theme="light"] .bchip{color:#4338ca}
html[data-theme="light"] .tag-pill.good,
html[data-theme="light"] .act.have{color:#047857}
html[data-theme="light"] .act.on,
html[data-theme="light"] .upi.on,
html[data-theme="light"] .poll-btns button.on{color:#92400e}
html[data-theme="light"] .act.del,
html[data-theme="light"] .small-btn,
html[data-theme="light"] .errcode,
html[data-theme="light"] .reset.armed{color:#b91c1c}
html[data-theme="light"] .act.del.armed{color:#7f1d1d}
html[data-theme="light"] .links a.on,
html[data-theme="light"] .chip.on{color:#3730a3}
html[data-theme="light"] .t-card .r,
html[data-theme="light"] .status.hot{color:#c2410c}
html[data-theme="light"] .promo p{color:var(--tx)}
html[data-theme="light"] .you,
html[data-theme="light"] .copy{background:#f59e0b}

/* ---------- the toggle button ---------- */
.theme-btn{width:38px;height:38px;flex:none;display:grid;place-items:center;border-radius:12px;
  border:1px solid var(--bd);background:var(--card2);color:var(--tx);font-size:17px;line-height:1;cursor:pointer;
  transition:transform .15s,border-color .2s}
.theme-btn:hover{transform:rotate(-12deg) scale(1.08);border-color:var(--am)}
.theme-btn:active{transform:scale(.92)}
.theme-btn:focus-visible{outline:2px solid #f59e0b;outline-offset:2px}
.theme-btn.floating{position:fixed;top:14px;right:14px;z-index:300}
@media (max-width:640px){.theme-btn{width:34px;height:34px;font-size:15px;border-radius:10px}}

/* smooth cross-fade while switching (skipped for reduced motion) */
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{
  transition:background-color .25s ease,color .25s ease,border-color .25s ease!important}
</style>

<script>
(function(){
  'use strict';
  var KEY = 'roomie_theme';            // saved choice: 'light' or 'dark'
  var root = document.documentElement;
  var btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'theme-btn';

  function saved(){ try{ return localStorage.getItem(KEY); }catch(e){ return null; } }
  function save(t){ try{ localStorage.setItem(KEY, t); }catch(e){} }

  function apply(t){
    root.setAttribute('data-theme', t);
    var next = t === 'light' ? 'dark' : 'light';
    btn.textContent = t === 'light' ? '🌙' : '☀️';
    btn.setAttribute('aria-label', 'Switch to ' + next + ' mode');
    btn.title = 'Switch to ' + next + ' mode';
    var m = document.querySelector('meta[name="theme-color"]');
    if(!m){ m = document.createElement('meta'); m.name = 'theme-color'; document.head.appendChild(m); }
    m.content = t === 'light' ? '#f3f4fa' : '#080a0f';
  }

  btn.addEventListener('click', function(){
    var next = root.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(!calm){ root.classList.add('theme-anim'); setTimeout(function(){ root.classList.remove('theme-anim'); }, 350); }
    apply(next); save(next);
  });

  // put the button in the dashboard navbar, or float it top-right on the login page
  var host = document.querySelector('.nav-in');
  if(host){
    var pro = document.getElementById('goPro');
    host.insertBefore(btn, pro && pro.parentNode === host ? pro : null);
  }else{
    btn.className += ' floating';
    document.body.appendChild(btn);
  }

  // default = dark (your original design). To follow the phone/PC setting instead, use:
  // apply(saved() || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'));
  apply(saved() === 'light' ? 'light' : 'dark');

  // keep two open tabs in sync
  window.addEventListener('storage', function(e){
    if(e.key === KEY) apply(e.newValue === 'light' ? 'light' : 'dark');
  });
})();
</script>
<!-- ===== end of light / dark mode block ===== -->
</body>
</html>
